services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: log_anomaly_loghub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/log_anomaly_loghub
      SECRET_KEY: docker-dev-secret
    depends_on:
      - db
volumes:
  postgres_data:
